[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayi"
version = "0.1.0"
description = "A small, auditable privilege broker semantic model"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mayi = "mayi.cli:main"
mayi-approve = "mayi.approval_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mayi*"]
